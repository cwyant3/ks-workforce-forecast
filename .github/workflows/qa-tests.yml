name: Model and Dashboard QA

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q *.py dashboard scripts tests

      - name: Run unit and dashboard tests
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
        run: python -m pytest -q --disable-warnings

      - name: Validate committed dashboard outputs
        run: python scripts/validate_outputs.py
